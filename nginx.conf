server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # PWA: Service Worker and ngsw files must never be cached by browser
    location ~* (ngsw\.json|ngsw-worker\.js|safety-worker\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # Cache static assets aggressively (hashed filenames)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webmanifest)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Language redirection at root
    location = / {
        set $lang "en";
        if ($http_accept_language ~* "^pl") {
            set $lang "pl";
        }
        return 302 /$lang/;
    }

    # English SPA
    location /en/ {
        try_files $uri $uri/ /en/index.html;
    }

    # Polish SPA
    location /pl/ {
        try_files $uri $uri/ /pl/index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
